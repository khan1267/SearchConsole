<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="chart-line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Metric Quick Tiles -->
  <g transform="translate(20, 20)">
    <!-- Total Clicks -->
    <rect x="0" y="0" width="130" height="64" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Total clicks</text>
    <text x="14" y="48" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#38bdf8">148.2K</text>
    
    <!-- Total Impressions -->
    <rect x="140" y="0" width="130" height="64" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" />
    <text x="154" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Total impressions</text>
    <text x="154" y="48" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#818cf8">3.82M</text>

    <!-- Average CTR -->
    <rect x="280" y="0" width="130" height="64" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" />
    <text x="294" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Average CTR</text>
    <text x="294" y="48" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#10b981">7.4%</text>

    <!-- Average Position -->
    <rect x="420" y="0" width="135" height="64" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" />
    <text x="434" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Average position</text>
    <text x="434" y="48" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#fbbf24">2.8</text>
  </g>

  <!-- Chart Grid Area -->
  <g transform="translate(20, 110)">
    <!-- Horizontal Grid lines -->
    <line x1="0" y1="0" x2="555" y2="0" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
    <line x1="0" y1="50" x2="555" y2="50" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
    <line x1="0" y1="100" x2="555" y2="100" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
    <line x1="0" y1="150" x2="555" y2="150" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3" />
    <line x1="0" y1="200" x2="555" y2="200" stroke="rgba(255,255,255,0.12)" />

    <!-- Area Fill -->
    <path d="M 0,165 
             C 45,160 80,145 130,120 
             C 180,95 220,130 270,80 
             C 320,30 360,70 410,40 
             C 460,10 510,35 555,15 
             L 555,200 L 0,200 Z" 
          fill="url(#chart-area-grad)" />

    <!-- Main Trend Curve with Glow -->
    <path d="M 0,165 
             C 45,160 80,145 130,120 
             C 180,95 220,130 270,80 
             C 320,30 360,70 410,40 
             C 460,10 510,35 555,15" 
          stroke="url(#chart-line-grad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow-filter)" />

    <!-- Data points -->
    <circle cx="130" cy="120" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
    <circle cx="270" cy="80" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
    <circle cx="410" cy="40" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
    <circle cx="555" cy="15" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2" />

    <!-- Tooltip badge at summit -->
    <g transform="translate(470, -18)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#10b981" />
      <text x="42" y="17" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#042f1a" text-anchor="middle">#1 Position</text>
    </g>

    <!-- X Axis Dates -->
    <text x="0" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Sep 1</text>
    <text x="130" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Sep 15</text>
    <text x="270" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Oct 1</text>
    <text x="410" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Oct 10</text>
    <text x="525" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981" font-weight="600">Today</text>
  </g>
</svg>
